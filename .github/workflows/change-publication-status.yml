name: Change publication status

on:
  workflow_dispatch:
    inputs:
      item_path:
        description: "Folder containing app.json (for example: notebooks/quantum_tunneling_1)"
        required: true
        type: string
      status:
        description: "Publication status"
        required: true
        type: choice
        options:
          - draft
          - review
          - approved

permissions:
  contents: write

jobs:
  update-status:
    runs-on: ubuntu-latest
    steps:
      - name: Check out qontic-dev
        uses: actions/checkout@v4

      - name: Update app.json status
        env:
          ITEM_PATH: ${{ inputs.item_path }}
          NEW_STATUS: ${{ inputs.status }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          item_path = Path(os.environ['ITEM_PATH'].strip().strip('/'))
          status = os.environ['NEW_STATUS']

          if not item_path.parts or item_path.parts[0] not in {'apps', 'notebooks'}:
              raise SystemExit('item_path must begin with apps/ or notebooks/')

          app_json = item_path / 'app.json'
          if not app_json.is_file():
              raise SystemExit(f'No app.json found at {app_json}')

          data = json.loads(app_json.read_text(encoding='utf-8'))
          old_status = data.get('status', '(missing)')
          data['status'] = status
          app_json.write_text(json.dumps(data, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          print(f'{app_json}: {old_status} -> {status}')
          PY

      - name: Commit status change
        run: |
          git config user.name "qontic-status"
          git config user.email "qontic-status@users.noreply.github.com"
          git add "${{ inputs.item_path }}/app.json"

          if git diff --cached --quiet; then
            echo "Status was already ${{ inputs.status }}; no commit needed."
            exit 0
          fi

          git commit -m "Set ${{ inputs.item_path }} status to ${{ inputs.status }}"
          git push
