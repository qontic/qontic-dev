name: Sync public qontic repository

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out qontic-dev
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.QONTIC_SYNC_TOKEN }}

      - name: Push qontic-dev main to qontic main
        run: |
          git remote add public https://x-access-token:${{ secrets.QONTIC_SYNC_TOKEN }}@github.com/qontic/qontic.git
          git push public main:main --force
